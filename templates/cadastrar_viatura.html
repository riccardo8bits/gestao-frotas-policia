{% extends 'home.html' %}

{% block content %}

<main class="dashboard-content">
    
    <!-- TOPBAR INTERNO -->
    <div class="topbar">
        <div>
            <h1>Cadastro de Viaturas</h1>
            <p class="subtitulo">Insira os dados da nova viatura para integrá-la à frota ativa.</p>
        </div>
    </div>

    <!-- FORMULÁRIO -->
    <div class="form-container">
        
        <div class="form-linha">
            <div class="form-campo">
                <label>PLACA</label>
                <input type="text" placeholder="Ex: ABC1D23">
            </div>
            <div class="form-campo">
                <label>PREFIXO</label>
                <input type="text" placeholder="Ex: V-1234">
            </div>
        </div>

        <div class="form-linha">
            <div class="form-campo full">
                <label>MODELO DA VIATURA</label>
                <select>
                    <option>Selecione o modelo...</option>
                    <option>Renault Duster</option>
                    <option>Chevrolet Trailblazer</option>
                    <option>Mitsubishi L200</option>
                    <option>Toyota Hilux</option>
                </select>
            </div>
        </div>

        <div class="form-linha">
            <div class="form-campo">
                <label>ANO DE FABRICAÇÃO</label>
                <input type="text" placeholder="YYYY">
            </div>
            <div class="form-campo">
                <label>ODÔMETRO INICIAL (KM)</label>
                <input type="number" placeholder="0">
            </div>
        </div>

        <!-- BOTÃO -->
        <div class="form-acoes">
            <button class="btn-salvar">💾 SALVAR VIATURA</button>
        </div>

    </div>

</main>

{% endblock content %}
